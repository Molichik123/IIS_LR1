name: income_app

services:
  income-predict:
    image: estate_model:1
    ports:
      - "8001:8000"
    volumes:
      - ./models:/models


  requests:
    image: test_requests:0
    deploy: 
      replicas: 1
      restart_policy:
        condition: always
        delay: 5s


